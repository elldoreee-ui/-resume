<style>html { scroll-behavior: smooth; }
body { background: #f6f4f0; color: #171412; }
html .ea-hero, html [data-slot='elias'], .cv {
  --font-ea-display: 'Inter', ui-sans-serif, system-ui, sans-serif;
  --font-ea-sans: 'Manrope', ui-sans-serif, system-ui, sans-serif;
  --font-ea-mono: 'IBM Plex Mono', ui-monospace, 'Courier New', monospace;
}
.cv { --page: #f6f4f0; --ink: #171412; --accent: #ff4829; --muted: #77716e; --paper: #efe9df;
  background: var(--page); color: var(--ink); font-family: var(--font-ea-sans); font-size: 17px; line-height: 1.6; }
.cv-sec { max-width: 1440px; margin-inline: auto; padding-block: 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; border-top: 1px solid color-mix(in oklab, var(--ink) 14%, transparent); scroll-margin-top: 24px; }
.cv-sec > * { min-width: 0; }
@media (min-width: 640px) { .cv-sec { padding-left: 24px; padding-right: 24px; } }
@media (min-width: 1024px) { .cv-sec { padding-left: 40px; padding-right: 40px; grid-template-columns: 240px minmax(0, 1fr); gap: 48px; padding-block: 96px; } }
.cv-eyebrow { font-family: var(--font-ea-mono); font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin: 0; padding-top: 6px; }
.cv-big { font-family: var(--font-ea-display); font-weight: 900; font-size: clamp(1.7rem, 4.2vw, 3.4rem); line-height: 1.04; letter-spacing: -0.03em; text-wrap: balance; margin: 0; max-width: 22ch; }
.cv-about { display: grid; gap: 36px; }
.cv-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px 40px; color: color-mix(in oklab, var(--ink) 82%, transparent); }
.cv-cols p { margin: 0; max-width: 62ch; }
.cv-jobs { display: grid; gap: 56px; }
.cv-job h3 { font-family: var(--font-ea-display); font-weight: 900; font-size: clamp(1.35rem, 2.6vw, 2rem); letter-spacing: -0.025em; line-height: 1.1; margin: 0; text-wrap: balance; }
.cv-meta { font-family: var(--font-ea-mono); font-size: 13px; color: var(--muted); margin: 10px 0 0; max-width: 80ch; }
.cv-lead { margin: 18px 0 0; max-width: 70ch; }
.cv-job ul { list-style: none; margin: 20px 0 0; padding: 0; display: grid; gap: 12px; }
.cv-job li { position: relative; padding-left: 22px; max-width: 74ch; color: color-mix(in oklab, var(--ink) 86%, transparent); }
.cv-job li::before { content: ""; position: absolute; left: 0; top: 0.72em; width: 10px; height: 2px; background: var(--accent); }
.cv-job li b { font-weight: 700; color: var(--ink); }
.cv-skills { margin: 0; display: grid; }
.cv-skills > div { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; padding-block: 16px; border-bottom: 1px solid color-mix(in oklab, var(--ink) 12%, transparent); }
.cv-skills > div:first-child { padding-top: 0; }
@media (min-width: 720px) { .cv-skills > div { grid-template-columns: 240px minmax(0, 1fr); gap: 32px; } }
.cv-skills dt { font-weight: 700; }
.cv-skills dd { margin: 0; color: color-mix(in oklab, var(--ink) 80%, transparent); max-width: 70ch; }
.cv-contact { padding-bottom: 120px; }
.cv-contact .cv-big { grid-column: 2; }
.cv-contacts { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px 32px; grid-column: 1 / -1; }
@media (min-width: 1024px) { .cv-contacts { grid-column: 2; } }
@media (max-width: 1023px) { .cv-contact .cv-big { grid-column: 1; } }
.cv-contacts li { font-size: 1.15rem; font-weight: 600; user-select: all; overflow-wrap: anywhere; }
.cv-contacts span { display: block; font-family: var(--font-ea-mono); font-size: 12px; font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); user-select: none; margin-bottom: 4px; }
.cv-contacts a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 4px; }
.cv a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
/* The template sizes the name for "Elias Monroe"; these fit "Vlada Spertsyan" */
html .ea-name-first { font-size: 24cqw; }
html .ea-name-last { font-size: 15.4cqw; }
@media (min-width: 1024px) and (min-aspect-ratio: 5/4) {
  html .ea-name-first { font-size: calc(245 * var(--ea-u)); top: calc(var(--ea-top) + 42 * var(--ea-u) - 0.136em); }
  html .ea-name-last { font-size: calc(158 * var(--ea-u)); top: calc(var(--ea-last-top) + 40 * var(--ea-u) - 0.136em); }
}
.ea-splash-name g text:nth-of-type(1) { font-size: 250px; }
.ea-splash-name g text:nth-of-type(2) { font-size: 146px; }
/* The ink spotlight keeps the outlined letters but shows the photo as it is */
html .ea-ink-portrait { filter: none; }
/* Roles stay on one line; the note has no counter; the social link sits clear of the Russian intro copy */
html .ea-intro-roles { flex-wrap: nowrap; white-space: nowrap; letter-spacing: 0.08em; }
html .ea-letter-meta { display: none; }
@media (min-width: 640px) {
  html .ea-socials { top: max(var(--ea-last-top) + 44 * var(--ea-u) + max(330 * var(--ea-u), 340px), 100% - 78 * var(--ea-u) - 40px); }
}
@media (min-width: 640px) { html .ea-intro-description { max-width: calc(212 * var(--ea-u)); } }
/* No wordmark: the four links sit in one evenly spaced row */
html .ea-nav-logo { display: none; }
@media (min-width: 640px) {
  html .ea-nav-left { margin-right: calc(var(--ea-nav-gap) / 2); }
  html .ea-nav-right { margin-left: calc(var(--ea-nav-gap) / 2); }
}
/* About: four paragraphs in an even two-by-two block, with no orphan row */
.cv-cols { grid-template-columns: minmax(0, 1fr); gap: 16px 40px; max-width: 1040px; }
@media (min-width: 760px) { .cv-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
/* The note is longer than the template's: smaller type, and the hero grows on short screens so nothing is cut at its bottom edge */
@media (min-width: 1024px) and (min-aspect-ratio: 5/4) {
  html .ea-hero { min-height: max(100svh, min(59vw, 100svh + 150px)); }
  html .ea-letter-greeting, html .ea-letter-field { font-size: max(13px, 16 * var(--ea-u)); }
  html .ea-letter-greeting { margin-top: calc(16 * var(--ea-u)); }
}
/* Gallery under the Qonversion block: one justified strip in colour, each picture uncropped */
.cv-gallery { margin-top: 36px; max-width: 912px; display: grid; gap: 14px; }
.cv-gal-title { font-family: var(--font-ea-mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 0; }
.cv-gal-strip { display: flex; flex-direction: column; gap: 20px; }
.cv-gal-pair { display: flex; gap: 12px; align-items: flex-start; }
.cv-gallery figure { margin: 0; min-width: 0; flex: var(--ar) 1 0; }
.cv-gallery img { display: block; width: 100%; height: auto; aspect-ratio: var(--ar); border-radius: 10px; }
.cv-gallery figcaption { font-size: 14px; font-weight: 600; margin-top: 8px; color: var(--ink); }
/* The note opens with a large "Добро пожаловать!" beside a smaller stamp; the text starts right under it */
html .ea-letter-sheet .ea-letter-eyebrow { display: none; }
html .ea-letter-stamp { width: 60px; height: 60px; top: 12px; right: 14px; font-size: 9px; }
html .ea-letter-greeting { margin-top: 0; padding-right: 76px; font-size: 22px; line-height: 1.2; font-weight: 500; margin-bottom: 30px; }
@media (min-width: 1024px) and (min-aspect-ratio: 5/4) {
  html .ea-letter-stamp { width: max(52px, 60 * var(--ea-u)); height: max(52px, 60 * var(--ea-u)); top: calc(14 * var(--ea-u)); right: calc(16 * var(--ea-u)); font-size: max(8px, 9 * var(--ea-u)); }
  html .ea-letter-greeting { margin-top: calc(2 * var(--ea-u)); padding-right: calc(max(52px, 60 * var(--ea-u)) + 16 * var(--ea-u)); font-size: max(17px, 26 * var(--ea-u)); margin-bottom: calc(26 * var(--ea-u)); }
}
/* About: paragraphs flow in two columns with the same gap everywhere */
@media (min-width: 760px) { .cv-cols { display: block; columns: 2; column-gap: 40px; } .cv-cols p { break-inside: avoid; margin: 0 0 16px; max-width: none; } }
/* A lone picture in a row keeps the scale of its neighbours instead of stretching to full width */
.cv-gallery figure.cv-gal-half { flex: 0 0 calc(50% - 6px); }
.cv-gallery.cv-gallery-sm { max-width: 730px; }
html .ea-socials:empty { display: none; }
/* The intro keeps only the roles line: no headline, rule or description */
html .ea-intro-headline, html .ea-intro-rule, html .ea-intro-description { display: none; }

[data-slot='elias'],
.ea-hero {
  --color-ea-page: #f6f4f0;
  --color-ea-accent: #ff4829;
  --color-ea-ink: #171412;
  --color-ea-muted: #77716e;
  --color-ea-paper: #efe9df;

  --font-ea-display: 'Inter', ui-sans-serif, system-ui, sans-serif;
  --font-ea-sans: 'Figtree', ui-sans-serif, system-ui, sans-serif;
  --font-ea-mono: 'IBM Plex Mono', ui-monospace, 'Courier New', monospace;
}

/* The utilities the block's @theme generated (bg-ea-page, text-ea-ink, font-ea-display, ...), defined here because the host's Tailwind does not know these tokens */
@layer utilities {
  .bg-ea-page {
    background-color: var(--color-ea-page);
  }
  .bg-ea-ink {
    background-color: var(--color-ea-ink);
  }
  .bg-ea-accent {
    background-color: var(--color-ea-accent);
  }
  .text-ea-page {
    color: var(--color-ea-page);
  }
  .text-ea-page\\/70 {
    color: color-mix(in oklab, var(--color-ea-page) 70%, transparent);
  }
  .text-ea-ink {
    color: var(--color-ea-ink);
  }
  .text-ea-accent {
    color: var(--color-ea-accent);
  }
  .text-ea-muted {
    color: var(--color-ea-muted);
  }
  .border-ea-accent {
    border-color: var(--color-ea-accent);
  }
  .ring-ea-page {
    --tw-ring-color: var(--color-ea-page);
  }
  .font-ea-display {
    font-family: var(--font-ea-display);
  }
  .font-ea-sans {
    font-family: var(--font-ea-sans);
  }
  .font-ea-mono {
    font-family: var(--font-ea-mono);
  }
}

/**
 * The navbar and the composition share one centred container with a 16, 24 then 40px gutter; the hero is the
 * size container they measure it from. On the wide composition the container fills the screen's width up to
 * 1440px (--ea-w) and the design scales with it; past that nothing grows and the extra space goes to the sides.
 */
.ea-hero {
  --ea-gutter: 16px;
  --ea-nav-h: 84px;
  --ea-w: min(100cqw - 2 * var(--ea-gutter), 1440px);
  container-type: inline-size;
  min-height: 100svh;
  overflow: clip;
}

@media (min-width: 640px) {
  .ea-hero {
    --ea-gutter: 24px;
  }
}

@media (min-width: 1024px) {
  .ea-hero {
    --ea-gutter: 40px;
  }
}

.ea-wrap {
  width: var(--ea-w);
  margin-inline: auto;
}

/**
 * Navbar below 1024px: the logo centred on the first row with the contact button at its right end, and the four
 * links spread across the second row with equal space between them (the two link lists dissolve into the grid,
 * which spaces its four columns evenly). From 1024px it becomes a single row.
 */
.ea-nav {
  container-type: inline-size;
  display: grid;
  grid-template-columns: repeat(4, auto);
  justify-content: space-between;
  align-items: center;
  row-gap: 6px;
  padding-block: 14px 6px;
}

.ea-nav-logo {
  grid-row: 1;
  grid-column: 1 / -1;
  justify-self: center;
}

.ea-nav-cta {
  grid-row: 1;
  grid-column: 1 / -1;
  justify-self: end;
}

.ea-nav-left,
.ea-nav-right {
  display: contents;
  white-space: nowrap;
}

.ea-nav-left > li,
.ea-nav-right > li {
  grid-row: 2;
}

/**
 * Below 1024px (phones and tablets) the contact button is its arrow disc alone; its label stays for screen
 * readers. On a desktop it shows the label beside the disc.
 */
@media (max-width: 1023px) {
  .ea-nav-cta .ea-cta {
    gap: 0;
    padding: 4px;
  }

  .ea-nav-cta .ea-cta-label {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
}

/* The note at the navbar's left edge: shown from 1024px, where it balances the contact button */
.ea-nav-status {
  display: none;
}

/* Rolling labels: the visible copy slides up and out as its twin slides up into place */
.ea-roll {
  position: relative;
  display: inline-block;
  overflow: hidden;
  line-height: 1.25;
}

.ea-roll > span {
  display: block;
  transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
}

.ea-roll > span + span {
  position: absolute;
  inset: 0;
  transform: translateY(100%);
}

@media (hover: hover) {
  .ea-nav-link:hover .ea-roll > span:first-child {
    transform: translateY(-100%);
  }

  .ea-nav-link:hover .ea-roll > span + span {
    transform: translateY(0);
  }
}

/* Menu type: medium capitals with open tracking; the current page is marked with a small orange dot */
.ea-nav-link {
  font-size: clamp(12px, 3.4vw, 13px);
  letter-spacing: 0.06em;
}

.ea-nav-link[aria-current='page']::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}

.ea-nav-logo {
  font-size: 28px;
}

/**
 * From 640px the navbar is one row: the wordmark in the exact centre and the four links mirroring each other
 * around it with one equal gap (--ea-nav-gap); the contact button ends on the right edge. Type and spacing
 * follow the screen only within set limits, tighter on a tablet so everything fits on the row.
 */
@media (min-width: 640px) {
  .ea-nav {
    --ea-nav-u: calc(100cqw / 1280);
    --ea-nav-gap: clamp(16px, 2.6vw, 28px);
    grid-template-columns: 1fr auto 1fr;
    grid-template-areas: 'left logo right';
    justify-content: normal;
    height: var(--ea-nav-h);
    padding-block: 0;
  }

  .ea-nav-logo {
    grid-area: logo;
  }

  .ea-nav-left,
  .ea-nav-right {
    display: flex;
  }

  .ea-nav-left {
    grid-area: left;
    justify-self: end;
    gap: var(--ea-nav-gap);
    margin-right: var(--ea-nav-gap);
  }

  .ea-nav-right {
    grid-area: right;
    justify-self: start;
    gap: var(--ea-nav-gap);
    margin-left: var(--ea-nav-gap);
  }

  .ea-nav-cta {
    grid-area: right;
  }

  .ea-nav-link {
    font-size: clamp(13px, 14 * var(--ea-nav-u), 15px);
  }

  .ea-nav-logo {
    font-size: clamp(26px, 29 * var(--ea-nav-u), 32px);
  }
}

@media (min-width: 1024px) {
  .ea-nav {
    --ea-nav-gap: clamp(36px, 64 * var(--ea-nav-u), 80px);
  }
}

/* The navbar's status note needs the room a wider screen gives, so it appears from 1280px */
@media (min-width: 1280px) {
  .ea-nav-status {
    grid-area: left;
    justify-self: start;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--color-ea-muted);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* A live dot: a soft ring breathes out from it, slowly, so it reads as present without pulling focus */
  .ea-nav-status-dot {
    position: relative;
    width: 7px;
    height: 7px;
    margin-right: 2px;
    border-radius: 50%;
    background: var(--color-ea-accent);
  }

  .ea-nav-status-dot::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: var(--color-ea-accent);
    animation: ea-breathe 2.4s cubic-bezier(0.16, 1, 0.3, 1) infinite;
  }
}

/**
 * The ink button (CONTACT and the letter's actions): an outlined pill with an orange arrow disc at its end. On
 * hover or keyboard focus a circle of ink grows out of the disc until it fills the pill, the label turns to
 * the page colour, and the arrow leaves its disc as a fresh one arrives from the other side.
 */
.ea-cta {
  --ea-cta-mark: 34px;
  position: relative;
  isolation: isolate;
  display: inline-flex;
  align-items: center;
  gap: 14px;
  height: 44px;
  padding-inline: 20px 5px;
  overflow: hidden;
  border: 1px solid rgb(23 20 18 / 0.4);
  border-radius: 999px;
  color: var(--color-ea-ink);
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  white-space: nowrap;
  transition:
    color 0.4s cubic-bezier(0.16, 1, 0.3, 1),
    border-color 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

/* The ink starts as a dot at the disc's centre; scaled up 14 times it covers any of these pills */
.ea-cta::before {
  content: '';
  position: absolute;
  z-index: -1;
  top: 50%;
  right: calc(5px + var(--ea-cta-mark) / 2);
  width: var(--ea-cta-mark);
  height: var(--ea-cta-mark);
  margin: calc(var(--ea-cta-mark) / -2) calc(var(--ea-cta-mark) / -2) 0 0;
  border-radius: 50%;
  background: var(--color-ea-ink);
  transform: scale(0);
  transition: transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);
}

.ea-cta-mark {
  position: relative;
  display: grid;
  place-items: center;
  width: var(--ea-cta-mark);
  height: var(--ea-cta-mark);
  overflow: hidden;
  border-radius: 50%;
  background: var(--color-ea-accent);
  color: var(--color-ea-page);
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

.ea-cta-arrow {
  position: absolute;
  width: 44%;
  height: 44%;
  transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
}

.ea-cta-arrow-in {
  transform: translateX(-160%);
}

.ea-cta-diagonal .ea-cta-arrow-in {
  transform: translate(-160%, 160%);
}

.ea-cta:disabled {
  opacity: 0.4;
}

@media (hover: hover) {
  .ea-cta:not(:disabled):hover {
    border-color: var(--color-ea-ink);
    color: var(--color-ea-page);
  }

  .ea-cta:not(:disabled):hover::before {
    transform: scale(14);
  }

  .ea-cta:not(:disabled):hover .ea-cta-mark {
    transform: scale(1.06);
  }

  .ea-cta:not(:disabled):hover .ea-cta-arrow-out {
    transform: translateX(160%);
  }

  .ea-cta-diagonal:not(:disabled):hover .ea-cta-arrow-out {
    transform: translate(160%, -160%);
  }

  .ea-cta:not(:disabled):hover .ea-cta-arrow-in {
    transform: translate(0, 0);
  }
}

.ea-cta:focus-visible {
  border-color: var(--color-ea-ink);
  color: var(--color-ea-page);
  outline: 2px solid var(--color-ea-accent);
  outline-offset: 3px;
}

.ea-cta:focus-visible::before {
  transform: scale(14);
}

/**
 * Phones and tablets: the name and portrait form one framed figure, the portrait standing on a sheet of paper;
 * the introduction, the writing pad, the book and the social links follow it
 */
.ea-stage {
  padding-block: 12px 40px;
}

.ea-canvas {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-areas:
    'figure'
    'intro'
    'pad'
    'book'
    'socials';
  row-gap: 40px;
}

.ea-figure {
  grid-area: figure;
  position: relative;
  container-type: inline-size;
}

/* The name and portrait layers only matter on the wide composition; on smaller screens they leave no box */
.ea-layer {
  display: contents;
}

/* The ink spotlight's twins: the name as outlined type, the portrait through the ink duotone filter */
.ea-ink-first,
.ea-ink-last {
  color: var(--color-ea-accent);
  filter: url(#ea-ink-outline);
}

.ea-ink-last {
  color: var(--color-ea-ink);
}

.ea-ink-portrait {
  filter: url(#ea-ink-duotone);
}

.ea-name {
  position: relative;
  display: flex;
  flex-direction: column;
  line-height: 0.8;
}

/* Set on each line, not the heading, so the em resolves against the giant size rather than 16px */
.ea-name-first,
.ea-name-last {
  letter-spacing: 0.02em;
}

/**
 * Each letter of the name is revealed inside a mask that hugs the capitals (overshoot included) rather than the
 * line box, so a letter in motion only ever shows within its own line and never crosses the other one
 */
.ea-name {
  --ea-mask-top: 0.015em;
  --ea-mask-bottom: 0.015em;
}

.ea-letter-mask {
  clip-path: inset(var(--ea-mask-top) -0.25em var(--ea-mask-bottom) -0.25em);
}

/**
 * Inter's capitals start 0.039em inside their box and MONROE's box ends 0.05em past its last stroke (its
 * trailing letter-spacing included), so the margins put the ink itself on the container edges
 */

.ea-name-first {
  font-size: 27.4cqw;
  margin-left: -0.039em;
}

.ea-name-last {
  align-self: flex-end;
  font-size: 22.3cqw;
  margin-right: -0.05em;
}

/* The paper the portrait stands on, where the composition's desk sits on a wide screen */
.ea-figure::after {
  content: '';
  display: block;
  width: 64cqw;
  height: 60cqw;
  margin: 3cqw 0 0 auto;
  border-radius: 10px 10px 0 0;
  background: var(--color-ea-paper);
}

.ea-portrait {
  position: absolute;
  z-index: 1;
  top: 9cqw;
  left: -3cqw;
  height: calc(100% - 9cqw);
  width: auto;
  max-width: none;
}

.ea-intro {
  grid-area: intro;
}

.ea-intro-roles {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75em;
  font-size: 11px;
  letter-spacing: 0.2em;
  margin-bottom: 14px;
}

.ea-intro-headline {
  font-size: 24px;
  line-height: 1.14;
  letter-spacing: -0.01em;
  margin-bottom: 22px;
}

.ea-intro-rule {
  width: 52px;
  height: 2px;
  margin-bottom: 22px;
}

.ea-intro-description {
  max-width: 260px;
  font-size: 15px;
  line-height: 1.55;
}

.ea-book {
  grid-area: book;
}

.ea-book-frame {
  position: relative;
  aspect-ratio: 324 / 207;
  border-radius: 10px;
  background: var(--color-ea-paper);
  container-type: size;
}

.ea-book-caption {
  margin-top: 12px;
}

.ea-socials {
  grid-area: socials;
}

@media (min-width: 640px) {
  .ea-canvas {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-areas:
      'figure figure'
      'intro book'
      'pad pad'
      'socials socials';
    column-gap: 32px;
  }

  .ea-figure::after {
    height: 48cqw;
  }
}

/**
 * The letter to tomorrow. The area holds one view at a time: the letter sheet, the sealed envelope, the sent note,
 * the waiting envelope, or the opened letter. The sheet is the paper, tipped slightly as if just set down.
 */
.ea-pad {
  grid-area: pad;
  position: relative;
}

.ea-pad-inner {
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 380px;
}

.ea-letter-sheet,
.ea-letter-envelope-view {
  position: relative;
  display: flex;
  flex: 1;
  flex-direction: column;
}

.ea-letter-sheet {
  padding: 24px 22px 18px;
  border-radius: 4px;
  background: #fbf9f5;
  box-shadow: 0 18px 40px -18px rgb(23 20 18 / 0.45);
}

.ea-letter-eyebrow {
  padding-right: 64px;
  color: var(--color-ea-muted);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.24em;
  text-transform: uppercase;
}

.ea-letter-stamp {
  position: absolute;
  top: 14px;
  right: 14px;
  display: grid;
  place-items: center;
  width: 76px;
  height: 76px;
  padding: 0 0 0 0.16em;
  border: 2px solid var(--color-ea-accent);
  border-radius: 50%;
  color: var(--color-ea-accent);
  font-size: 10.5px;
  font-weight: 700;
  line-height: 1.3;
  text-align: center;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  transform: rotate(12deg);
  transition:
    transform 0.45s cubic-bezier(0.16, 1, 0.3, 1),
    background-color 0.3s,
    color 0.3s,
    opacity 0.4s;
}

/* Dim while the letter is being typed, full once it is finished, and pressed flat in orange as it seals */
.ea-letter-stamp {
  opacity: 0.35;
}

.ea-letter-stamp.is-ready {
  opacity: 1;
}

.ea-letter-stamp.is-pressed {
  background: var(--color-ea-accent);
  color: var(--color-ea-page);
  transform: rotate(0deg) scale(0.86);
}

.ea-letter-greeting {
  display: block;
  margin-top: 20px;
  color: var(--color-ea-ink);
  font-family: var(--font-ea-mono);
  font-size: 17px;
}

.ea-letter-field {
  flex: 1;
  width: 100%;
  min-height: 84px;
  margin-top: 4px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--color-ea-ink);
  caret-color: var(--color-ea-accent);
  font-family: var(--font-ea-mono);
  font-size: 17px;
  line-height: 1.65;
  resize: none;
  outline: none;
}

.ea-letter-read {
  white-space: pre-wrap;
}

/* The typewriter's caret: an orange block that blinks after the last typed character */
.ea-letter-caret {
  display: inline-block;
  width: 0.55em;
  height: 1.1em;
  margin-left: 2px;
  background: var(--color-ea-accent);
  vertical-align: -0.2em;
  animation: ea-caret 1s steps(2, jump-none) infinite;
}

@keyframes ea-caret {
  50% {
    opacity: 0;
  }
}

.ea-letter-meta {
  margin-top: auto;
  color: var(--color-ea-muted);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

.ea-letter-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 16px;
  margin-top: auto;
}

.ea-letter-row .ea-letter-meta {
  margin-top: 0;
}

/* The sealing view: its label above the envelope, both centred in the letter's space at every width */
.ea-letter-envelope-view {
  align-items: center;
  justify-content: center;
  gap: 18px;
  text-align: center;
}

/* The label here has no stamp to clear, so it drops the sheet's right inset and stays truly centred */
.ea-letter-envelope-view .ea-letter-eyebrow {
  padding-right: 0;
}

/**
 * The envelope from the back: paper body, two side folds and a bottom fold meeting under a top flap that is
 * hinged at the top edge. Sized in its own width (cqw) so the seal and postmark keep their proportions.
 */
.ea-envelope {
  position: relative;
  display: block;
  width: min(100%, 320px);
  aspect-ratio: 1.62;
  border-radius: 6px;
  background: #e6dccb;
  box-shadow:
    0 22px 40px -22px rgb(23 20 18 / 0.55),
    0 2px 6px -2px rgb(23 20 18 / 0.18);
  container-type: inline-size;
  perspective: 900px;
}

.ea-envelope > span {
  position: absolute;
}

/* The letter being packed: a folded sheet with a few typed lines, slid down behind the folds */
.ea-envelope-letter {
  inset: 6% 7% auto;
  height: 86%;
  border-radius: 3px;
  background:
    repeating-linear-gradient(to bottom, transparent 0 9cqw, rgb(23 20 18 / 0.22) 9cqw 9.6cqw) 12% 22% / 62% 40%
      no-repeat,
    #fbf9f5;
  box-shadow: 0 2px 6px rgb(23 20 18 / 0.15);
}

.ea-envelope-side {
  inset: 0;
  border-radius: 6px;
  background: #ece3d4;
}

.ea-envelope-left {
  clip-path: polygon(0 0, 52% 56%, 0 100%);
}

.ea-envelope-right {
  clip-path: polygon(100% 0, 48% 56%, 100% 100%);
}

.ea-envelope-bottom {
  inset: 0;
  border-radius: 6px;
  background: #f4eee4;
  clip-path: polygon(0 100%, 50% 47%, 100% 100%);
}

/* The flap's soft shadow comes from a filter on its wrapper, since a clip-path would cut a box-shadow off */
.ea-envelope-flap {
  inset: 0 0 auto;
  height: 60%;
  filter: drop-shadow(0 3px 3px rgb(23 20 18 / 0.18));
  transform-origin: top center;
}

.ea-envelope-flap-shape {
  position: absolute;
  inset: 0;
  border-radius: 6px 6px 0 0;
  background: linear-gradient(to bottom, #ddd0bb, #e3d7c4);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
}

/* The wax seal, pressed where the flap's tip meets the folds: a slightly domed disc with a raised rim */
.ea-wax-seal {
  top: 60%;
  left: 50%;
  display: grid;
  place-items: center;
  width: 17cqw;
  aspect-ratio: 1;
  margin: -8.5cqw 0 0 -8.5cqw;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ff7457, var(--color-ea-accent) 55%, #c9361c);
  box-shadow:
    0 3px 6px rgb(23 20 18 / 0.3),
    inset 0 0 0 0.9cqw rgb(255 255 255 / 0.16);
  color: rgb(246 244 240 / 0.9);
  font-size: 7.5cqw;
  font-weight: 900;
  line-height: 1;
}

/* A round postmark on the bottom fold, with cancellation bars running off to its left */
.ea-postmark {
  right: 7%;
  bottom: 9%;
  display: grid;
  place-items: center;
  align-content: center;
  width: 23cqw;
  aspect-ratio: 1;
  border: 0.5cqw solid var(--color-ea-accent);
  border-radius: 50%;
  color: var(--color-ea-accent);
  font-size: 2.6cqw;
  font-weight: 700;
  line-height: 1.35;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  opacity: 0.88;
}

.ea-postmark::before {
  content: '';
  position: absolute;
  inset: 7%;
  border: 0.25cqw solid currentColor;
  border-radius: 50%;
}

.ea-postmark::after {
  content: '';
  position: absolute;
  top: 30%;
  right: 100%;
  width: 26cqw;
  height: 40%;
  background: repeating-linear-gradient(to bottom, currentColor 0 0.4cqw, transparent 0.4cqw 2.2cqw);
  opacity: 0.7;
}

.ea-postmark-date {
  font-family: var(--font-ea-mono);
  font-weight: 400;
  letter-spacing: 0.04em;
}

/**
 * Landscape screens from 1024px: the design's composition, measured on a 1280px grid in units of --ea-u, so
 * it scales with the container (1.0625px at 1440, never more). The canvas fills the hero below the navbar.
 */
@media (min-width: 1024px) and (min-aspect-ratio: 5/4) {
  .ea-hero {
    display: grid;
    grid-template-rows: auto 1fr;
  }

  /**
   * Never shorter than the name, the introduction and the social links need at their smallest scale, so nothing
   * can collide; only a very short window scrolls
   */
  .ea-stage {
    position: relative;
    min-height: calc(var(--ea-w) * 621 / 1600 + 40px);
    padding: 0;
  }

  /**
   * --ea-slack is the height beyond the composition's minimum. A small share opens above the name and the rest
   * lengthens the portrait and the writing pad, which both run to the bottom edge. The portrait stops at
   * 738 units (784px at 1440, never under 640px); past that the name moves down so the head stays over ELIAS.
   */
  /**
   * --ea-u follows the width, but on a wide, short window it follows the height instead (the name, introduction
   * and social links need 621 units plus 40px), so the design still fits one screen while staying anchored to
   * both edges; it never drops below 80% of the width's unit
   */
  .ea-canvas {
    --ea-u: max(min(100cqw / 1280, (100cqh - 40px) / 621), 100cqw / 1600);
    --ea-slack: max(0px, 100cqh - 685 * var(--ea-u));
    --ea-head: calc(55 * var(--ea-u));
    --ea-portrait-max: max(738 * var(--ea-u), 640px);

    /* The portrait keeps its place against MONROE (which is set from the right edge), never nearer than 221px */
    --ea-portrait-left: max(100cqw - 1070 * var(--ea-u), 221px);
    --ea-top: max(10 * var(--ea-u) + var(--ea-slack) * 0.15, 100cqh - var(--ea-portrait-max) - var(--ea-head));
    --ea-portrait-h: min(100cqh - var(--ea-top) - var(--ea-head), var(--ea-portrait-max));
    /* The name's two lines: ELIAS's cap top, then MONROE's, then MONROE's baseline */
    --ea-last-top: calc(var(--ea-top) + 242 * var(--ea-u));
    --ea-last-base: calc(var(--ea-top) + 406 * var(--ea-u));
    position: absolute;
    inset: 0;
    display: block;
    container-type: size;
  }

  .ea-figure {
    display: contents;
  }

  /**
   * Each layer covers the composition exactly, so the twins inside it land on the same pixels as the originals.
   * The originals are masked to everything outside the spotlight and the twins to the inside. The twins reach
   * 1px past the originals' soft edge, so no seam of page shows between them; at a radius of 0 the originals
   * show whole and the twins not at all.
   */
  .ea-layer {
    position: absolute;
    inset: 0;
    display: block;
    pointer-events: none;
  }

  .ea-layer-name {
    z-index: 0;
  }

  .ea-layer-portrait {
    z-index: 2;
  }

  .ea-layer-base {
    --ea-spot: radial-gradient(
      circle var(--ea-spot-r, 0px) at var(--ea-spot-x, 0px) var(--ea-spot-y, 0px),
      transparent calc(var(--ea-spot-r, 0px) - 1px),
      #000 calc(var(--ea-spot-r, 0px) + 1px)
    );
    mask-image: var(--ea-spot);
    -webkit-mask-image: var(--ea-spot);
  }

  .ea-layer-ink {
    --ea-spot: radial-gradient(
      circle var(--ea-spot-r, 0px) at var(--ea-spot-x, 0px) var(--ea-spot-y, 0px),
      #000 calc(var(--ea-spot-r, 0px) + 1px),
      transparent calc(var(--ea-spot-r, 0px) + 2px)
    );
    mask-image: var(--ea-spot);
    -webkit-mask-image: var(--ea-spot);
  }

  /* At a line height of 1 the capitals sit 0.124em below the box top and end 0.124em above its bottom */
  .ea-name {
    --ea-mask-top: 0.115em;
    --ea-mask-bottom: 0.115em;
    position: static;
    display: block;
    line-height: 1;
  }

  /**
   * Placed by their cap tops (0.136em is the gap Inter leaves above a capital at a line height of 1): ELIAS
   * 220px tall and 881px wide, MONROE 164px tall and 1008px wide, with the ink on the container edges
   */
  .ea-name-first,
  .ea-name-last {
    position: absolute;
    white-space: nowrap;
  }

  .ea-name-first {
    top: calc(var(--ea-top) - 0.136em);
    left: -0.039em;
    margin: 0;
    font-size: calc(302 * var(--ea-u));
  }

  .ea-name-last {
    top: calc(var(--ea-last-top) - 0.136em);
    right: -0.05em;
    margin: 0;
    font-size: calc(225 * var(--ea-u));
  }

  .ea-figure::after {
    display: none;
  }

  /* Fills the space under MONROE, sharing the book's right edge; the letter inside runs off the bottom edge */
  .ea-pad {
    position: absolute;
    z-index: 1;
    top: calc(var(--ea-last-base) + 16 * var(--ea-u));
    left: calc(620 * var(--ea-u));
    width: calc(100% - 620 * var(--ea-u));
    height: calc(100% - var(--ea-last-base) - 16 * var(--ea-u));
  }

  /**
   * The letter starts clear of the portrait's coat, which reaches the full width of the cut-out (1072 of its
   * 1336px height) and drifts up to 14px with the cursor; the inset is measured from the portrait's real size
   */
  .ea-pad-inner {
    min-height: 0;
    padding: calc(14 * var(--ea-u)) calc(18 * var(--ea-u)) 0
      max(
        120 * var(--ea-u),
        var(--ea-portrait-left) + var(--ea-portrait-h) * 1072 / 1336 - 620 * var(--ea-u) + 14px + 24 * var(--ea-u)
      );
  }

  .ea-letter-sheet {
    padding: calc(24 * var(--ea-u)) calc(26 * var(--ea-u)) calc(18 * var(--ea-u));
    border-radius: 4px 4px 0 0;
  }

  .ea-letter-eyebrow,
  .ea-letter-meta {
    font-size: max(10px, 11 * var(--ea-u));
  }

  .ea-letter-stamp {
    top: calc(16 * var(--ea-u));
    right: calc(18 * var(--ea-u));
    width: max(64px, 78 * var(--ea-u));
    height: max(64px, 78 * var(--ea-u));
    font-size: max(9px, 10.5 * var(--ea-u));
  }

  .ea-letter-greeting {
    margin-top: calc(22 * var(--ea-u));
    font-size: max(14px, 18 * var(--ea-u));
  }

  .ea-letter-field {
    min-height: 0;
    font-size: max(14px, 18 * var(--ea-u));
  }

  .ea-envelope {
    width: min(100%, 330 * var(--ea-u));
  }

  /**
   * Stands on the bottom edge with the top of its head 55px under the top of ELIAS. Its left edge stays put as
   * it grows, never nearer than 221px, so the coat clears the social links and leaves MONROE's M readable
   */
  .ea-portrait {
    z-index: 2;
    top: calc(100% - var(--ea-portrait-h));
    left: var(--ea-portrait-left);
    height: var(--ea-portrait-h);
  }

  .ea-intro {
    position: absolute;
    z-index: 3;
    top: calc(var(--ea-last-top) + 44 * var(--ea-u));
    left: 0;
    width: calc(250 * var(--ea-u));
  }

  /* Spacing grows down the stack: label to heading, then heading to rule and rule to description */
  .ea-intro-roles {
    gap: 0.4em 0.55em;
    font-size: max(10px, 11 * var(--ea-u));
    letter-spacing: 0.15em;
    margin-bottom: calc(18 * var(--ea-u));
  }

  .ea-intro-headline {
    font-size: max(19px, 26 * var(--ea-u));
    line-height: 1.12;
    margin-bottom: calc(26 * var(--ea-u));
  }

  .ea-intro-rule {
    width: calc(52 * var(--ea-u));
    margin-bottom: calc(26 * var(--ea-u));
  }

  .ea-intro-description {
    max-width: calc(240 * var(--ea-u));
    font-size: max(14px, 15.5 * var(--ea-u));
    line-height: 1.6;
    text-wrap: pretty;
  }

  /* Its image spans ELIAS's upper 200px and its caption ends just above MONROE */
  .ea-book {
    position: absolute;
    z-index: 1;
    top: var(--ea-top);
    right: 0;
    width: calc(344 * var(--ea-u));
  }

  .ea-book-frame {
    border-radius: calc(12 * var(--ea-u));
  }

  .ea-book-frame {
    height: calc(200 * var(--ea-u));
    aspect-ratio: auto;
  }

  .ea-book-caption {
    gap: calc(10 * var(--ea-u));
    margin-top: calc(8 * var(--ea-u));
  }

  .ea-book-label {
    font-size: max(12px, 14 * var(--ea-u));
  }

  .ea-book-topics {
    font-size: max(11px, 12.5 * var(--ea-u));
  }

  .ea-socials {
    position: absolute;
    z-index: 3;
    font-size: max(13px, 13 * var(--ea-u));

    /* Near the bottom edge, or just under the introduction when the screen is too short for that */
    top: max(var(--ea-last-top) + 44 * var(--ea-u) + max(305 * var(--ea-u), 280px), 100% - 78 * var(--ea-u) - 40px);
    left: 0;
  }
}

/**
 * Hover feedback, only where the device can hover: a hairline drawn in from the left and wiped out to the
 * right, the contact button filling with ink from below, and the book's arrow swapping for a fresh one
 */
.ea-link {
  position: relative;
}

/**
 * The book's arrow is the CONTACT disc at a smaller size, shrinking with the composition on a smaller desktop
 * so the caption always clears the top of MONROE (--ea-u exists only there; elsewhere it stays 28px)
 */
.ea-book-arrow .ea-cta-mark {
  --ea-cta-mark: clamp(22px, 28 * var(--ea-u, 1px), 28px);
}

@media (hover: hover) {
  .ea-link::after {
    content: '';
    position: absolute;
    inset-inline: 0;
    bottom: calc(50% - 0.95em);
    height: 1px;
    background: currentColor;
    transform: scaleX(0);
    transform-origin: right;
    transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .ea-link:hover::after {
    transform: scaleX(1);
    transform-origin: left;
  }

  .ea-book:hover .ea-book-arrow .ea-cta-arrow-out {
    transform: translate(160%, -160%);
  }

  .ea-book:hover .ea-book-arrow .ea-cta-arrow-in {
    transform: translate(0, 0);
  }
}

/* The splash's name fills most of the width but never grows past its 1440 size, and keeps clear of the edges */
.ea-splash-name {
  width: min(88vw, 130svh);
  max-height: 70%;
  height: auto;
  overflow: visible;
}

/* With reduced motion the splash never shows, even for the moment before the script decides to skip it */
@media (prefers-reduced-motion: reduce) {
  .ea-splash {
    display: none;
  }
}

/* The custom cursor stands in for the system one everywhere in the hero, links and the splash included */
.ea-has-cursor,
.ea-has-cursor * {
  cursor: none;
}

/**
 * The code-built hardcover, sized from its frame (cqh) so it keeps its proportion at every width. It is a box:
 * back, page edges, orange spine, the first page, and a cover hinged on its left edge so it can swing open.
 */
/**
 * Holds one book while it slides in or out, so the book's own turning and opening stay independent of the swap.
 * Each fills the card, so the leaving and arriving books share the same place as they pass.
 */
.ea-book-slot {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  transform-style: preserve-3d;
}

/* Left-aligned like a printed page, rather than centred like the button the book sits in */
.ea-book-stage {
  position: absolute;
  inset: 0;
  text-align: left;
  display: grid;
  place-items: center;
  perspective: 900px;
}

.ea-book-shadow {
  position: absolute;
  bottom: 9cqh;
  width: 46cqh;
  height: 7cqh;
  border-radius: 50%;
  background: radial-gradient(closest-side, rgb(23 20 18 / 0.35), transparent);
  filter: blur(4px);
}

.ea-book-3d {
  --ea-book-depth: 9cqh;
  position: relative;
  display: block;
  height: 74cqh;
  aspect-ratio: 0.72;
  transform-style: preserve-3d;
}

.ea-book-3d > span {
  position: absolute;
}

.ea-book-back {
  display: block;
  inset: 0;
  border-radius: 2px 5px 5px 2px;
  background: color-mix(in srgb, var(--ea-cover, #171412) 78%, black);
  transform: translateZ(calc(var(--ea-book-depth) / -2));
}

/* The page block's fore-edge, finely ruled like stacked leaves */
.ea-book-edge {
  display: block;
  top: 2%;
  right: 0;
  width: var(--ea-book-depth);
  height: 96%;
  background: repeating-linear-gradient(to right, #f3eee6 0 1.5px, #ddd5c8 1.5px 2.5px);
  transform: translateX(50%) rotateY(90deg);
}

.ea-book-spine {
  top: 0;
  left: 0;
  width: var(--ea-book-depth);
  height: 100%;
  display: grid;
  place-items: center;
  overflow: hidden;
  background: var(--ea-spine, var(--color-ea-accent));
  transform: translateX(-50%) rotateY(-90deg);
}

.ea-book-spine > span {
  color: var(--ea-cover-type, var(--color-ea-ink));
  font-size: 3.4cqh;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  white-space: nowrap;
  transform: rotate(90deg);
}

.ea-book-page {
  inset: 2% 3% 2% 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2.5cqh;
  padding: 0 10% 0 14%;
  background: linear-gradient(to right, rgb(23 20 18 / 0.12), transparent 14%), #fbf9f5;
  transform: translateZ(calc(var(--ea-book-depth) / 2 - 2px));
}

.ea-book-page-chapter {
  color: var(--color-ea-accent);
  font-size: 3cqh;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.ea-book-page-text {
  color: #2a2522;
  font-size: 3.8cqh;
  line-height: 1.5;
}

.ea-book-folio {
  position: absolute;
  bottom: 6%;
  left: 0;
  right: 0;
  color: var(--color-ea-muted);
  font-size: 3cqh;
  text-align: center;
}

/* Motion writes the cover's whole transform as it swings, so the front-face depth lives on this wrapper */
.ea-book-hinge {
  inset: 0;
  transform: translateZ(calc(var(--ea-book-depth) / 2));
  transform-style: preserve-3d;
}

.ea-book-cover {
  position: absolute;
  inset: 0;
  transform-origin: left center;
  transform-style: preserve-3d;
}

/* The cover's two faces: the dark front, and the inside that faces the reader once the cover has swung over */
.ea-book-cover-front,
.ea-book-cover-inside {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  backface-visibility: hidden;
}

.ea-book-cover-front {
  justify-content: space-between;
  padding: 11% 10% 9%;
  border-radius: 2px 5px 5px 2px;
  overflow: hidden;
  background: var(--ea-cover, var(--color-ea-ink));
  color: var(--ea-cover-type, var(--color-ea-page));
  box-shadow: inset 3px 0 0 rgb(255 255 255 / 0.25);
}

.ea-book-cover-inside {
  justify-content: center;
  gap: 2.5cqh;
  padding: 0 12%;
  border-radius: 5px 2px 2px 5px;
  background: linear-gradient(to left, rgb(23 20 18 / 0.12), transparent 14%), #fbf9f5;
  transform: rotateY(180deg);
}

.ea-book-inside-title {
  color: var(--color-ea-ink);
  font-size: 8cqh;
  font-weight: 900;
  line-height: 0.95;
  letter-spacing: -0.02em;
  text-transform: uppercase;
}

.ea-book-title {
  font-size: 9.6cqh;
  font-weight: 900;
  line-height: 0.92;
  letter-spacing: -0.02em;
  text-transform: uppercase;
}

.ea-book-byline {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  font-size: 2.8cqh;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
}

/* The cover's pastel illustration fills the board behind the title and byline */
.ea-book-art {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border-radius: inherit;
}

.ea-book-title,
.ea-book-byline {
  position: relative;
}

@keyframes ea-breathe {
  0% {
    opacity: 0.55;
    transform: scale(1);
  }

  70%,
  100% {
    opacity: 0;
    transform: scale(3);
  }
}

@media (prefers-reduced-motion: reduce) {
  .ea-nav-status-dot::after,
  .ea-letter-caret {
    animation: none;
  }
}
